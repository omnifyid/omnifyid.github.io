<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:12px;min-width:0;font-family:'Hanken Grotesk',sans-serif;color:#22281F">
<div style="position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:18px;background:#DAD5CA">
<img src="{{ p.src }}" alt="{{ p.name }}" style="width:100%;height:100%;object-fit:cover;display:block">
<sc-if value="{{ p.hasHover }}" hint-placeholder-val="{{ false }}"><img src="{{ p.hoverSrc }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s ease" style-hover="opacity:1"></sc-if>
<sc-if value="{{ p.hasTag }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:12px;left:12px;background:rgba(246,244,239,.94);border-radius:40px;padding:6px 12px;font-size:12px;font-weight:600">{{ p.tagSoft }}</span></sc-if>
<div style="position:absolute;left:10px;right:10px;bottom:10px;background:rgba(232,228,219,.94);border-radius:12px;padding:6px;display:flex;gap:4px">
<sc-for list="{{ p.sizes }}" as="z" hint-placeholder-count="5"><button onClick="{{ z.add }}" style="flex:1;min-width:0;padding:0;height:{{ p.tapH }};border:none;border-radius:8px;background:transparent;font-size:12px;font-weight:600;color:#22281F;cursor:pointer" style-hover="background:#22281F;color:#E8E4DB">{{ z.s }}</button></sc-for>
</div>
</div>
<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
<div style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:15px;font-weight:600;line-height:1.3">{{ p.name }}</span><span style="font-size:13px;color:#5C6356">{{ p.colorLabel }}</span></div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap"><span style="font-size:15px;font-weight:600">{{ p.now }}</span><sc-if value="{{ p.hasOff }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#5C6356;text-decoration:line-through">{{ p.was }}</span></sc-if></div>
</div>
<div style="display:flex;gap:8px"><sc-for list="{{ p.swatches }}" as="w" hint-placeholder-count="2"><button onClick="{{ w.pick }}" title="{{ w.name }}" style="width:{{ p.swS }};height:{{ p.swS }};border-radius:50%;background:{{ w.hex }};border:1px solid rgba(0,0,0,.12);padding:0;cursor:pointer;box-shadow:{{ w.ring }}"></button></sc-for></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:500},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
